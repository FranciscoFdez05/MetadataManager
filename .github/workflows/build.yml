name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependencias
        run: dotnet restore MetadataManager.sln

      - name: Compilar
        run: dotnet build MetadataManager.sln --no-restore --configuration Release -warnaserror

      - name: Ejecutar pruebas
        run: dotnet test MetadataManager.sln --no-build --configuration Release --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: Publicar resultados de las pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx

  publish:
    runs-on: windows-latest
    needs: build
    if: github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publicar ejecutable único
        run: dotnet publish src/MetadataManager/MetadataManager.csproj -c Release -r win-x64 -p:PublishSingleFile=true -o publish

      - name: Subir el ejecutable
        uses: actions/upload-artifact@v4
        with:
          name: MetadataManager-win-x64
          path: publish/MetadataManager.exe
